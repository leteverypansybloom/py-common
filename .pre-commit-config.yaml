# Pre-commit hooks run automatically before git commit
# Install: pip install pre-commit
# Setup: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Code formatting
  # Hook versions match what CI installs from the dev extra, so a
  # commit that passes here passes CI (REVIEW_.md L7).
  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
        language_version: python3.11
        args: ["--line-length=79"]

  # Linting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: ["--line-length=79", "--select=E,F,W"]

  # Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        # Same scope as CI (mypy src/py_common --strict); tests are
        # not written to strict typing.
        files: ^src/py_common/
        # The Google libraries aren't installed here; pyproject's
        # mypy overrides cover them.
        additional_dependencies: ["types-PyYAML", "types-openpyxl", "types-requests"]
        args: ["--strict"]

  # Secret detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  # YAML validation
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
