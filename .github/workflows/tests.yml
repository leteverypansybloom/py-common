name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Tests import google.cloud.storage and google.cloud.bigquery,
          # which only ship in the [gcp] extra — without it, the
          # BigQuery/GCS adapter test modules fail to collect and CI
          # was silently not running them.
          pip install -e ".[dev,gcp]"

      - name: Run tests
        run: |
          pytest tests/ -v --cov=src/py_common --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Lint with ruff
        run: |
          ruff check src/ tests/

      - name: Format check with black
        run: |
          black --check --line-length=79 src/ tests/

      - name: Type check with mypy
        run: |
          mypy src/py_common --strict
