[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rdd-dst-healthyworkingwales"
version = "0.1.0"
description = "Ingestion pipeline for Healthy Working Wales"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Public Health Wales", email = "eoinvondy@gmail.com"}]
requires-python = ">=3.11"
dependencies = [
    "py-common @ file:///../py-common",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 79
target-version = ["py311"]

[tool.ruff]
line-length = 79
select = ["E", "F", "W"]
