# Development Configuration
# Use local files and folders (no cloud credentials needed)

dev:
  # Read Excel files from a local folder
  source:
    type: local
    folder: ./test_files

  # Write raw, processed, and audit files to local folders
  storage:
    type: local
    folder: ./output

  # Define workbook validation rules
  contracts:
    # Events: Employer workplace safety events
    - name: events
      worksheet: Events
      key_columns: [event_id]
      columns:
        - name: event_id
          data_type: string
          nullable: false
          unique: true
        - name: employer_id
          data_type: string
          nullable: false
        - name: attendees
          data_type: integer
          nullable: false

    # WAS: Workplace Assessment Summary
    - name: was
      worksheet: Results
      key_columns: [was_id]
      columns:
        - name: was_id
          data_type: string
          nullable: false
          unique: true
        - name: employer_id
          data_type: string
          nullable: false
        - name: score
          data_type: integer
          nullable: true
