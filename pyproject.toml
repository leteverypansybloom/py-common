[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py-common"
version = "0.1.0"
description = "Shared ingestion library for Excel → Cloud workflows"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Public Health Wales", email = "eoinvondy@gmail.com"}]
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.0.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.7.0",
    "detect-secrets>=1.5.0",
    # mypy --strict needs type stubs for untyped runtime deps, or it
    # stops at the import line before checking any real code.
    "types-PyYAML>=6.0",
    "pandas-stubs>=2.0.0",
    "types-openpyxl>=3.0.0",
]
gcp = [
    "google-cloud-storage>=2.10.0",
    "google-cloud-bigquery>=3.13.0",
]
sharepoint = [
    "microsoft-graph-core>=0.2.0",
    "azure-identity>=1.14.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 79
target-version = ["py311"]

[tool.ruff]
line-length = 79
select = ["E", "F", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
# numpy's own bundled type stubs use syntax that requires Python
# 3.12+ (e.g. `type X = ...`), which mypy refuses to parse while
# targeting 3.11. Nothing here imports numpy directly - it only
# arrives transitively via pandas - so numpy's stubs are skipped
# rather than raising the project's python_version target, which
# would stop mypy enforcing 3.11 compatibility for our own code.
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = ["integration: marks tests requiring live cloud services"]
