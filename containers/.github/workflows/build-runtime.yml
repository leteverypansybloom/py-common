name: Build CDSC Runtime Container Images

on:
  push:
    branches:
      - main

jobs:

  detect-changes:

    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed speciality groups
        id: detect
        shell: bash
        run: |

          echo "Checking changed files"

          git diff --name-only HEAD~1 HEAD > changes.txt

          echo "Changed files:"
          cat changes.txt

          if grep -q "^runtime/" changes.txt
          then
            echo "Runtime files changed"
            echo "All runtime images will be rebuilt"

            echo 'matrix=["testsg","sarstestimg"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_GROUPS=$(grep "^speciality_groups/" changes.txt || true)

          if [ -z "$CHANGED_GROUPS" ]
          then
            echo "No speciality group or runtime changes detected"
            echo "No container rebuild required"

            echo 'matrix=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MATRIX=$(echo "$CHANGED_GROUPS" | cut -d/ -f2 | sort -u | jq -R . | jq -s -c .)

          echo "Speciality groups requiring builds:"
          echo "$MATRIX"

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build-runtime:

    needs: detect-changes

    if: needs.detect-changes.outputs.matrix != '[]'

    strategy:
      fail-fast: false

      matrix:
        speciality_group: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Validate configuration
        shell: bash
        run: |

          echo "Validating workflow configuration"

          if [ -z "${{ vars.GCP_PROJECT }}" ]; then
            echo "Missing GitHub Variable: GCP_PROJECT"
            exit 1
          fi

          if [ -z "${{ vars.ARTIFACT_REGISTRY_LOCATION }}" ]; then
            echo "Missing GitHub Variable: ARTIFACT_REGISTRY_LOCATION"
            exit 1
          fi

          if [ -z "${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}" ]; then
            echo "Missing GitHub Variable: ARTIFACT_REGISTRY_REPOSITORY"
            exit 1
          fi

          echo "Configuration validated"

      - name: Configure Docker
        shell: bash
        run: |

          echo "Project    : ${{ vars.GCP_PROJECT }}"
          echo "Location   : ${{ vars.ARTIFACT_REGISTRY_LOCATION }}"
          echo "Repository : ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}"

          gcloud auth configure-docker "${{ vars.ARTIFACT_REGISTRY_LOCATION }}-docker.pkg.dev" --quiet

      - name: Validate dependency files
        shell: bash
        run: |

          echo "Validating dependency files"

          test -f speciality_groups/${{ matrix.speciality_group }}/r-dependencies.txt
          test -f speciality_groups/${{ matrix.speciality_group }}/python-dependencies.txt

          echo "Dependency files validated"

      - name: Prepare build files
        shell: bash
        run: |

          echo "Preparing build files"

          rm -rf build
          mkdir -p build

          cp speciality_groups/${{ matrix.speciality_group }}/r-dependencies.txt build/r-dependencies.txt

          cp speciality_groups/${{ matrix.speciality_group }}/python-dependencies.txt build/python-dependencies.txt

          echo "Build files prepared"

      - name: Generate image version
        shell: bash
        run: |

          VERSION=$(date +%Y%m%d-%H%M%S)

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "Version: $VERSION"

      - name: Build image
        shell: bash
        run: |

          IMAGE_NAME="cdsc-${{ matrix.speciality_group }}-img-dev"

          echo "Building image: $IMAGE_NAME"

          docker build \
            -f runtime/Dockerfile \
            -t "${{ vars.ARTIFACT_REGISTRY_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}/${IMAGE_NAME}:latest" \
            -t "${{ vars.ARTIFACT_REGISTRY_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}/${IMAGE_NAME}:${VERSION}" \
            .

      - name: Export installed R packages
        shell: bash
        run: |

          IMAGE_NAME="cdsc-${{ matrix.speciality_group }}-img-dev"

          echo "Exporting installed R packages"

          docker run --rm \
            --entrypoint Rscript \
            "${{ vars.ARTIFACT_REGISTRY_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}/${IMAGE_NAME}:latest" \
            -e "cat(sort(installed.packages()[,1]), sep='\n')" \
            > installed-r-packages.txt

          echo "R package inventory created"

      - name: Export installed Python packages
        shell: bash
        run: |

          IMAGE_NAME="cdsc-${{ matrix.speciality_group }}-img-dev"

          echo "Exporting installed Python packages"

          docker run --rm \
            --entrypoint pip \
            "${{ vars.ARTIFACT_REGISTRY_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}/${IMAGE_NAME}:latest" \
            list \
            > installed-python-packages.txt

          echo "Python package inventory created"

      - name: Upload package inventory
        uses: actions/upload-artifact@v4
        with:
          name: package-inventory-${{ matrix.speciality_group }}
          path: |
            installed-r-packages.txt
            installed-python-packages.txt

      - name: Push latest image
        shell: bash
        run: |

          IMAGE_NAME="cdsc-${{ matrix.speciality_group }}-img-dev"

          echo "Pushing latest image"

          docker push "${{ vars.ARTIFACT_REGISTRY_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}/${IMAGE_NAME}:latest"

      - name: Push versioned image
        shell: bash
        run: |

          IMAGE_NAME="cdsc-${{ matrix.speciality_group }}-img-dev"

          echo "Pushing versioned image"

          docker push "${{ vars.ARTIFACT_REGISTRY_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}/${IMAGE_NAME}:${VERSION}"

      - name: Build summary
        shell: bash
        run: |

          IMAGE_NAME="cdsc-${{ matrix.speciality_group }}-img-dev"

          echo "Build completed"
          echo "Image    : $IMAGE_NAME"
          echo "Version  : $VERSION"
          echo "Registry : ${{ vars.ARTIFACT_REGISTRY_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}"
